[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "downloader"
version = "1.0.0"
description = "A fast download manager for files, YouTube videos and playlists"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.7",
    "requests>=2.32",
    "yt-dlp",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-qt", "pyinstaller"]

[project.scripts]
downloader = "downloader.__main__:main"

[tool.setuptools.packages.find]
include = ["downloader*"]

[tool.setuptools.package-data]
"downloader.ui" = ["assets/*", "assets/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: hits the internet (run with RUN_NETWORK=1)"]
qt_api = "pyside6"
